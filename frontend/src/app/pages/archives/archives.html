<div class="archives-container">

  <!-- Search Filters -->
  <div class="section-card">
    <h4 class="section-label">Search Filters</h4>
    <div class="filter-row">
      <input class="search-input" type="text" placeholder="Search archives..."
             [(ngModel)]="search" />
      <div class="dropdown-btn">
        Type
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
      <div class="dropdown-btn">
        Generated By
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
      <div class="dropdown-btn">
        Date
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Table card -->
  <div class="section-card no-pad">

    <!-- Select-all / Download-all control row -->
    <div class="table-control-row">
      <label class="checkbox-label">
        <input type="checkbox" [checked]="allSelected" (change)="toggleSelectAll($event)" />
        <span>Select all</span>
      </label>

      <div class="control-right">
        <span class="selection-count" *ngIf="selectedIds.size > 0">
          {{ selectedIds.size }} of {{ reports.length }} selected
        </span>
        <button class="btn-download-all"
                [disabled]="selectedIds.size === 0"
                (click)="downloadSelected()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download Selected
        </button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-responsive">
      <table class="archives-table">
        <thead>
          <tr>
            <th class="col-check"></th>
            <th>Report Name</th>
            <th>Template Used</th>
            <th>Type</th>
            <th>Generated By</th>
            <th>Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of filteredReports"
              [class.row-selected]="selectedIds.has(r.id)">
            <td class="col-check">
              <input type="checkbox"
                     [checked]="selectedIds.has(r.id)"
                     (change)="toggleRow(r.id, $event)" />
            </td>
            <td>{{ r.name }}</td>
            <td class="muted">{{ r.template }}</td>
            <td><span class="type-pill">{{ r.type }}</span></td>
            <td class="muted">{{ r.generatedBy }}</td>
            <td class="muted">{{ r.date }}</td>
            <td>
              <span class="status-badge"
                    [class.badge-done]="r.status === 'DONE'"
                    [class.badge-processing]="r.status === 'PROCESSING'"
                    [class.badge-failed]="r.status === 'FAILED'">
                {{ r.status }}
              </span>
            </td>
            <td>
              <button class="btn-download" (click)="downloadReport(r)"
                      [disabled]="r.status !== 'DONE'">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="7 10 12 15 17 10"/>
                  <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Download
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="pagination-row">
      <button class="page-btn" [disabled]="currentPage === 1" (click)="changePage(currentPage - 1)">&#8249;</button>
      <ng-container *ngFor="let p of pageNumbers">
        <button class="page-btn" [class.active]="p === currentPage" (click)="changePage(p)">{{ p }}</button>
      </ng-container>
      <span class="page-ellipsis">...</span>
      <button class="page-btn" (click)="changePage(totalPages)">{{ totalPages }}</button>
      <button class="page-btn" [disabled]="currentPage === totalPages" (click)="changePage(currentPage + 1)">&#8250;</button>
    </div>

  </div>
</div>
