<div class="archives-container">
  <div class="section-card">
    <h4 class="section-label">Search Filters</h4>
    <div class="filter-row">
      <input
        class="search-input"
        type="text"
        placeholder="Search by report name, template, or generated by..."
        [(ngModel)]="search" />

      <div class="dropdown-wrapper" (click)="onDropdownClick($event)">
        <button class="filter-button" (click)="toggleDropdown('date', $event)">
          {{ dateFilterLabel }}
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
        <div class="filter-panel" *ngIf="dropdownStates.date">
          <button class="panel-option" (click)="setDateFilter('ALL')">All dates</button>
          <button class="panel-option" (click)="setDateFilter('LAST_7')">Last 7 days</button>
          <button class="panel-option" (click)="setDateFilter('LAST_30')">Last 30 days</button>
          <button class="panel-option" (click)="setDateFilter('THIS_MONTH')">This month</button>
          <div class="custom-date-row">
            <label>
              From
              <input type="date" [(ngModel)]="customDateFrom" />
            </label>
            <label>
              To
              <input type="date" [(ngModel)]="customDateTo" />
            </label>
          </div>
          <div class="panel-actions">
            <button class="panel-apply" (click)="setDateFilter('CUSTOM')">Apply</button>
            <button class="panel-clear" (click)="clearFilter('date')">Clear</button>
          </div>
        </div>
      </div>

      <div class="dropdown-wrapper" (click)="onDropdownClick($event)">
        <button class="filter-button" (click)="toggleDropdown('template', $event)">
          {{ templateFilterLabel }}
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
        <div class="filter-panel wide" *ngIf="dropdownStates.template">
          <div class="panel-header">
            <span>Templates</span>
            <button class="panel-clear" (click)="clearFilter('template')">Clear</button>
          </div>
          <label class="checkbox-option" *ngFor="let option of templateOptions">
            <input
              type="checkbox"
              [checked]="selectedTemplates.has(option)"
              (change)="toggleTemplate(option)" />
            <span>{{ option }}</span>
          </label>
        </div>
      </div>

      <div class="dropdown-wrapper" (click)="onDropdownClick($event)">
        <button class="filter-button" (click)="toggleDropdown('status', $event)">
          {{ statusFilterLabel }}
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
        <div class="filter-panel" *ngIf="dropdownStates.status">
          <div class="panel-header">
            <span>Status</span>
            <button class="panel-clear" (click)="clearFilter('status')">Clear</button>
          </div>
          <label class="checkbox-option" *ngFor="let option of statusOptions">
            <input
              type="checkbox"
              [checked]="selectedStatuses.has(option)"
              (change)="toggleStatus(option)" />
            <span>{{ option }}</span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <div class="card-list">
    <div class="archive-card" *ngFor="let report of pagedReports">
      <div class="card-content">
        <div class="card-left">
          <div class="card-title">{{ report.name }}</div>
          <div class="card-meta-line">
            {{ report.details }} · Generated by <strong>{{ report.generatedBy }}</strong> · {{ formatDate(report.date) }}
          </div>

          <div class="progress-row">
            <div class="progress-bar-wrapper">
              <div class="progress-bar" [ngClass]="'progress-bar-' + report.status.toLowerCase()" [style.width.%]="(report.generatedCount / report.totalCount) * 100"></div>
            </div>

            <div class="count-status-row">
              <span class="generated-count" [ngClass]="'generated-count-' + report.status.toLowerCase()">
                {{ report.generatedCount }} of {{ report.totalCount }} generated
              </span>
              <span class="status-badge" [ngClass]="statusClasses[report.status]">{{ report.status }}</span>
            </div>
          </div>
        </div>

        <div class="card-right">
          <button class="card-btn view" (click)="viewReport(report)">View reports</button>
          <button class="card-btn primary" *ngIf="report.status === 'DONE'" (click)="downloadReport(report)">Download all</button>
          <button class="card-btn retry" *ngIf="report.status === 'FAILED'" (click)="retryReport(report)">Retry all</button>
          <span class="processing-label" *ngIf="report.status === 'PROCESSING'">Processing...</span>
        </div>
      </div>
    </div>
  </div>

  <nav class="pagination-row" aria-label="Archives pagination">
    <button class="page-step-btn" [disabled]="currentPage === 1" (click)="changePage(currentPage - 1)" aria-label="Previous Page">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="pagination-pages-list">
      <button *ngFor="let page of pageNumbers" class="page-btn" [class.active]="page === currentPage" (click)="changePage(page)">{{ page }}</button>
    </div>
    <button class="page-step-btn" [disabled]="currentPage === pageCount" (click)="changePage(currentPage + 1)" aria-label="Next Page">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </nav>
</div>
