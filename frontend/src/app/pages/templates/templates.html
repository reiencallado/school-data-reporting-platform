<div class="templates-container">

  <div class="section-card">
    <div class="filter-row">

      <div class="search-bar-wrapper">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          type="text"
          placeholder="Search templates..."
          class="search-input search-input-icon"
          (input)="onSearchChange($event)" />
      </div>

      <div class="checkbox-dropdown-wrapper" (click)="$event.stopPropagation()">
        <div class="dropdown-btn" (click)="toggleReportKindDropdown($event)">
          {{ reportKindLabel }}
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
        <div class="dropdown-checkbox-panel" *ngIf="reportKindDropdownOpen">
          <button
            *ngFor="let option of reportKindOptions"
            class="panel-option"
            [class.active]="selectedReportKind === option.value"
            (click)="selectReportKind(option.value)">
            {{ option.label }}
          </button>
        </div>
      </div>

      <div class="checkbox-dropdown-wrapper" *ngIf="isAdmin" (click)="$event.stopPropagation()">
        <div class="dropdown-btn" (click)="toggleSchoolDropdown($event)">
          {{ getSchoolLabel() }}
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
        <div class="dropdown-checkbox-panel" *ngIf="schoolDropdownOpen">
          <div class="dropdown-panel-header">
            <span>School</span>
            <button class="dropdown-clear-btn" (click)="clearSchoolFilter()">Clear</button>
          </div>
          <label *ngFor="let school of schoolOptions" class="checkbox-option-label">
            <input type="checkbox" [checked]="selectedSchools.has(school.id)" (change)="onSchoolToggle(school.id)">
            <span>{{ school.name }}</span>
          </label>
          <p class="no-options-msg" *ngIf="schoolOptions.length === 0">No schools found</p>
        </div>
      </div>

      <div class="type-toggle" *ngIf="isAdmin && selectedReportKind !== 'DATA'">
        <button class="type-pill" [class.active]="selectedType === 'K12'" (click)="selectType('K12')">K12</button>
        <button class="type-pill" [class.active]="selectedType === 'COLLEGE'" (click)="selectType('COLLEGE')">College</button>
        <button class="type-pill" [class.active]="selectedType === 'ADMISSIONS'" (click)="selectType('ADMISSIONS')">Admissions</button>
        <button class="type-pill pill-all" [class.active]="selectedType === 'ALL'" (click)="selectType('ALL')">All</button>
      </div>
    </div>
  </div>

  <p *ngIf="loading" class="template-state-msg">Loading templates…</p>
  <p *ngIf="error" class="template-state-msg error">{{ error }}</p>

  <div class="template-grid" *ngIf="!loading && !error">

  <!-- CREATE card -->
  <div class="template-card create-card" (click)="openWizard()">
    <div class="create-icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </div>
    <span class="create-text" *ngIf="filteredTemplates.length === 0">
      Create your first template
    </span>
  </div>

  <!-- Template cards -->
  <div class="template-card" *ngFor="let t of filteredTemplates" (click)="previewTemplate(t)">

    <div class="kebab-wrapper" (click)="$event.stopPropagation()">
      <button class="kebab-btn" (click)="toggleMenu(t.id)" [class.open]="openMenuId === t.id" title="Options">
        <span></span><span></span><span></span>
      </button>
      <div class="kebab-dropdown" *ngIf="openMenuId === t.id">
        <button class="kebab-item" (click)="editTemplate(t); closeMenu()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          Edit
        </button>
        <button class="kebab-item" (click)="previewTemplate(t); closeMenu()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
          Preview
        </button>
        <div class="kebab-divider"></div>
        <button class="kebab-item danger" (click)="deleteTemplate(t); closeMenu()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
          Delete
        </button>
      </div>
    </div>

    <div class="template-preview">
      <app-template-thumbnail
        [thumbnailUrl]="t.thumbnailUrl"
        [template]="parsedConfiguration(t)"
        [label]="t.name">
      </app-template-thumbnail>
    </div>

    <div class="template-footer">
      <div>
        <span class="template-name">{{ t.name }}</span>
        <span class="template-meta">Last used: {{ t.lastUsed }}</span>
      </div>
    </div>
  </div>
</div>

  <app-template-creation-wizard
    [isOpen]="wizardOpen"
    (closed)="closeWizard()">
  </app-template-creation-wizard>

</div>

<div class="menu-backdrop" *ngIf="openMenuId" (click)="closeMenu()"></div>
