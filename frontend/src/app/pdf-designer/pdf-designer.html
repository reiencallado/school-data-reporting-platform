<div class="page-header">
    <input
        class="template-title-input"
        type="text"
        [(ngModel)]="currentName"
        (blur)="saveTemplate()"
        placeholder="Untitled Template"
    />

    <select
        *ngIf="!templateId"
        class="school-select"
        [(ngModel)]="currentSchoolId"
    >
        <option value="" disabled selected>Select a school...</option>
        <option *ngFor="let school of schools" [value]="school.id">{{ school.name }}</option>
    </select>

    <select
        class="school-select"
        [(ngModel)]="currentStudentType"
        (ngModelChange)="onStudentTypeChange()"
    >
        <option [ngValue]="null" disabled>Select student type...</option>
        <option *ngFor="let t of studentTypes" [ngValue]="t.id">{{ t.label }}</option>
    </select>

    <button class="preset-toggle-btn" type="button" (click)="togglePresetDrawer()" [class.active]="showPresetDrawer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Insert Field
    </button>

    <button class="paper-size-btn" type="button" (click)="showSizeModal = true">
        {{ paperSizeButtonLabel }}
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
    </button>

    <span class="autosave-status" *ngIf="autosaveStatus">{{ autosaveStatus }}</span>

    <button class="save-btn" (click)="saveTemplate()">Save</button>
</div>

<p class="save-error" *ngIf="saveError">{{ saveError }}</p>

<div class="designer-layout">
  <div id="designer"></div>

  <!-- Preset field drawer -->
  <aside class="preset-drawer" *ngIf="showPresetDrawer">
    <div class="preset-drawer-header">
      <h3>Insert Field</h3>
      <button class="preset-drawer-close" (click)="togglePresetDrawer()" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="preset-drawer-body">
      <div class="preset-group" *ngFor="let group of presetFieldGroups">
        <span class="preset-group-label">{{ group.label }}</span>
        <div class="preset-group-items">
          <button
            *ngFor="let preset of group.fields"
            type="button"
            class="preset-field-btn"
            (click)="insertPresetField(preset)">
            {{ preset.label }}
          </button>
        </div>
      </div>
    </div>
  </aside>
</div>

<app-resolution-modal
    [isOpen]="showSizeModal"
    mode="update"
    [initialSize]="modalInitialSize"
    [initialOrientation]="modalInitialOrientation"
    [initialCustomWidth]="modalInitialCustomWidth"
    [initialCustomHeight]="modalInitialCustomHeight"
    (close)="showSizeModal = false"
    (sizeConfirmed)="onSizeModalConfirm($event)">
</app-resolution-modal>
