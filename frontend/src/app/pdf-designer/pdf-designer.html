<div class="designer-header">

  <!-- Editable file name -->
  <div class="filename-wrapper" [class.editing]="editingName">

    <input *ngIf="editingName"
           class="filename-input"
           type="text"
           [(ngModel)]="fileName"
           (blur)="commitName()"
           (keydown.enter)="commitName()"
           (keydown.escape)="cancelEdit()"
           #nameInput
           maxlength="80" />

    <div *ngIf="!editingName" class="filename-display" (click)="startEdit()">
      <span class="filename-text">{{ fileName }}</span>
      <svg class="filename-edit-icon" width="13" height="13" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
    </div>

  </div>

</div>

<div id="designer"></div>
