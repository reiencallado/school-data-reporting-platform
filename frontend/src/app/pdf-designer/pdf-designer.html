<div class="page-header">
    <input
        class="template-title-input"
        type="text"
        [(ngModel)]="currentName"
        (blur)="saveTemplate()"
        placeholder="Untitled Template"
    />

    <select
        *ngIf="!templateId"
        class="school-select"
        [(ngModel)]="currentSchoolId"
    >
        <option value="" disabled selected>Select a school...</option>
        <option *ngFor="let school of schools" [value]="school.id">{{ school.name }}</option>
    </select>

    <button class="paper-size-btn" type="button" (click)="showSizeModal = true">
        {{ paperSizeButtonLabel }}
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
    </button>

    <span class="autosave-status" *ngIf="autosaveStatus">{{ autosaveStatus }}</span>

    <button class="save-btn" (click)="saveTemplate()">Save</button>
</div>

<p class="save-error" *ngIf="saveError">{{ saveError }}</p>

<div id="designer"></div>

<app-resolution-modal
    [isOpen]="showSizeModal"
    mode="update"
    [initialSize]="modalInitialSize"
    [initialOrientation]="modalInitialOrientation"
    [initialCustomWidth]="modalInitialCustomWidth"
    [initialCustomHeight]="modalInitialCustomHeight"
    (close)="showSizeModal = false"
    (sizeConfirmed)="onSizeModalConfirm($event)">
</app-resolution-modal>
